<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
  <main>
    <div class="calculator">

      <!--
        Display: id="display" is required by script.js (getElementById),
        which sets textContent directly on this element.
        role="status" + aria-live="polite" announce result updates to
        screen readers without interrupting the user.
      -->
      <div id="display"
           class="display"
           role="status"
           aria-live="polite">0</div>

      <!--
        Button grid: id="btn-grid" for JS event delegation;
        class="btn-grid" for the CSS 4-column grid layout.
        Every button carries class="btn" (JS .closest('.btn') selector)
        and a data-value attribute (JS reads btn.dataset.value).

        Layout in a 4-column grid (grid-template-columns: repeat(4, 1fr)):
          Row 1: C  ⌫  (  )          — utility / clear buttons
          Row 2: 7  8  9  ÷          — digit row
          Row 3: 4  5  6  ×          — digit row
          Row 4: 1  2  3  −          — digit row
          Row 5: +  0  .  [overflow] — = (grid-column: span 2) cannot fit
          Row 6: ========            — in the 1 remaining col of row 5,
                                       so auto-flow places it here at cols 1–2
      -->
      <div id="btn-grid" class="btn-grid">

        <!-- Row 1: utility -->
        <button class="btn clear"    data-value="C">C</button>
        <button class="btn clear"    data-value="⌫">⌫</button>
        <button class="btn operator" data-value="(">(</button>
        <button class="btn operator" data-value=")">)</button>

        <!-- Row 2 -->
        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn operator" data-value="/">&divide;</button>

        <!-- Row 3 -->
        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn operator" data-value="*">&times;</button>

        <!-- Row 4 -->
        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>
        <button class="btn operator" data-value="-">&minus;</button>

        <!-- Row 5: +, 0, . fill cols 1–3; = overflows to row 6 (span 2) -->
        <button class="btn operator" data-value="+">+</button>
        <button class="btn"          data-value="0">0</button>
        <button class="btn"          data-value=".">.</button>

        <!-- Equals: CSS gives this grid-column: span 2, so it auto-flows to
             the start of row 6 spanning cols 1–2. -->
        <button class="btn btn-equals equals" data-value="=">=</button>

      </div><!-- /.btn-grid -->
    </div><!-- /.calculator -->
  </main>
</body>
</html>
