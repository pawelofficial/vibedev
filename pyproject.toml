[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibedev"
version = "0.1.0"
description = "Agentic development as a Python package — give it a prompt, get a project."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "vibedev" }]
keywords = ["claude", "agent", "agentic", "codegen", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "claude-agent-sdk>=0.1",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]


[tool.hatch.build.targets.wheel]
packages = ["src/vibedev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
